name: Deploy with Rsync

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install poetry
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-ansi
        pip install psycopg2-binary

    - name: Run migrations
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-key
      run: |
        python manage.py migrate
        python manage.py loaddata users/fixtures/groups.json

    - name: Run tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-key
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Server via Rsync
      uses: burnett01/rsync-deployments@6.0
      with:
        switches: -avzr --delete --exclude=.git --exclude=.github --exclude=.env --exclude=__pycache__ --exclude=*.pyc --exclude=.pytest_cache
        path: ./
        remote_path: /home/${{ secrets.SERVER_USERNAME }}/django-rest-homework/
        remote_host: ${{ secrets.SERVER_HOST }}
        remote_user: ${{ secrets.SERVER_USERNAME }}
        remote_key: ${{ secrets.SERVER_SSH_KEY }}

    - name: Restart Application
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /home/${{ secrets.SERVER_USERNAME }}/django-rest-homework
          
          # Создаем .env файл
          cat > .env << 'EOF'
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=pg_db
          DB_PORT=5432
          SECRET_KEY='${{ secrets.SECRET_KEY }}'
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.SERVER_HOST }},localhost,127.0.0.1
          STRIPE_PUBLIC_KEY='${{ secrets.STRIPE_PUBLIC_KEY }}'
          STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}'
          REDIS_PORT_FOR_DOCKER=6379
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          EOF
          
          # Перезапускаем контейнеры
          docker compose down
          docker compose build
          docker compose up -d
          
          # Ждем запуска БД
          sleep 10
          
          # Применяем миграции и загружаем фикстуры
          docker compose exec -T web python manage.py migrate
          docker compose exec -T web python manage.py loaddata users/fixtures/groups.json
          docker compose exec -T web python manage.py collectstatic --noinput
          
          # Проверяем статус
          docker compose ps