services:
  web:
    build: .
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:80 --timeout 120 --workers 3 --reload
      "
    environment:
      - DEBUG=True
      - DB_HOST=pg_db
      - DATABASE_HOST=pg_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "80:80"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - django-web
          - web
          - django
    container_name: django-web  # Добавляем явное имя контейнера
    healthcheck:
      test: ["CMD-SHELL", "gunicorn --version || exit 1"]  # Проверяем, что gunicorn работает
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  nginx:
    image: nginx:alpine
    container_name: django-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      web:
        condition: service_healthy  # Ждем, пока web станет healthy
    networks:
      - app_network

  db:
    image: postgres:16-alpine
    container_name: pg_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME:-rest}"
      POSTGRES_USER: "${DB_USER:-homework}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-skypro}"
      PGUSER: homework
      PGDATABASE: rest
      PGPASSWORD: skypro
      USER: homework
      ROLE: homework
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homework}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT_FOR_DOCKER:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  celery:
    build: .
    container_name: celery
    command: celery -A config worker -l INFO
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
    networks:
      - app_network

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A config beat -l INFO
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - celery
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  static_volume: