services:
  web:
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

    environment:
      - DEBUG=True
      - DATABASE_HOST=localhost
      - CELERY_BROKER_URL="redis://redis:6379/0"
      - CELERY_RESULT_BACKEND="redis://redis:6379/0"
      - CELERY_TASK_ALWAYS_EAGER="True"
      - CELERY_TASK_EAGER_PROPAGATES="True"
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/code
      - .:/static
    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
#
  db:
    image: postgres:16-alpine
    container_name: pg_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_HOST: "${DB_HOST}"
      POSTGRES_PORT: "${DB_PORT}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: "Europe/Moscow"
      PGUSER: homework
      PGDATABASE: rest
      PGPASSWORD: skypro
      USER: homework
      ROLE: homework
    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
#
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT_FOR_DOCKER}:6379"
    volumes:
      - redis_data:/data
    command: redis-server
    healthcheck:
     test: ["CMD", "redis-cli", "ping"]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 30s
#
  celery:
    build: .
    container_name: celery
    command: ["python3", "-m", "celery", "-A", "config", "worker", "-l", "INFO"]
#    command: >
#      sh -c "python3 -m celery -A config worker -l INFO"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - web

  celery_beat:
    build: .
    container_name: celery_beat
    command: ["python3", "-m", "celery", "-A", "config", "beat", "-l", "INFO"]
    volumes:
      - .:/app/
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - celery

networks:
  app_network:

volumes:
  redis_data:
    driver: local
  postgres_data:
  static_volume: